{% extends "base.html" %}

{% block title %}Perros llamados Lassie{% endblock %}

{% block content %}
    <h1>Información de los Perros</h1>
    <table border="1">
        <tr>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Raza</th>
        </tr>
        {% for perro in perros %}
        <tr>
            <td>{{ perro.nombre}}</td>
            <td>{{ perro.edad}}</td>
            <td>{{ perro.raza}}</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
